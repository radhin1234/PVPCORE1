name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build
        run: mvn -B package

      - name: Upload the plugin jar
        uses: actions/upload-artifact@v4
        with:
          name: PvPCore
          path: target/PvPCore.jar
          if-no-files-found: error
